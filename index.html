<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERCHARGE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #14203a 0%, #060810 70%);
    color: #eaf0ff; text-align: center; padding: 24px;
  }
  .wrap { max-width: 560px; }
  h1 {
    font-size: clamp(3rem, 12vw, 6rem); letter-spacing: .08em; font-weight: 900;
    background: linear-gradient(90deg, #ff9e2c, #ff4d6d, #ff9e2c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,120,60,.25);
  }
  p.tag { color: #93a4c8; margin: .5rem 0 2.4rem; font-size: 1.05rem; letter-spacing:.02em; }
  .btns { display: flex; flex-direction: column; gap: 14px; }
  a.btn {
    display: block; padding: 16px 22px; border-radius: 12px; text-decoration: none;
    font-weight: 700; font-size: 1.1rem; letter-spacing: .03em; transition: transform .12s, box-shadow .12s;
  }
  a.play { background: linear-gradient(90deg,#ff7a2c,#ff4d6d); color: #fff; box-shadow: 0 8px 30px rgba(255,80,90,.35); }
  a.alt  { background: #172038; color: #cdd8f5; border: 1px solid #2a3556; }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  .note { margin-top: 2rem; color: #61708f; font-size: .82rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>OVERCHARGE</h1>
    <p class="tag">Arena combat in a Sci-Fi hangar. Fight, upgrade, survive.</p>
    <div class="btns">
      <a class="btn play" href="native/">▶ Play (3D — Godot)</a>
      <a class="btn alt" href="https://github.com/Burraga-Foundation/overcharge/releases/latest">Download the classic build</a>
    </div>
    <p class="note">Loads a WebAssembly build — first load may take a moment.</p>
  </div>
</body>
</html>
